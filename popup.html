<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px 16px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: #1b1f24;
        background: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #e8ebf0;
          background: #20242a;
        }
      }

      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        letter-spacing: 0.2px;
      }

      .subtitle {
        margin: 0 0 12px;
        font-size: 12px;
        opacity: 0.65;
      }

      #status {
        margin: 0 0 8px;
        font-size: 12px;
        min-height: 16px;
        opacity: 0.75;
      }

      .primary {
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: #1f6feb;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .primary:disabled {
        background: #9aa4b2;
        cursor: not-allowed;
      }

      .settings {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid rgba(128, 128, 128, 0.25);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        cursor: pointer;
      }

      .row span.label {
        line-height: 1.35;
      }

      .switch {
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
      }

      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #b9c0cc;
        transition: background 0.15s ease;
        pointer-events: none;
      }

      .track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        transition: transform 0.15s ease;
      }

      .switch input:checked + .track {
        background: #1f6feb;
      }

      .switch input:checked + .track::after {
        transform: translateX(16px);
      }

      .switch input:focus-visible + .track {
        outline: 2px solid #1f6feb;
        outline-offset: 2px;
      }

      #reset {
        width: 100%;
        margin-top: 12px;
        padding: 7px 10px;
        border: 1px solid rgba(128, 128, 128, 0.45);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .hint {
        margin: 10px 0 0;
        font-size: 11px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>Alphaxlick</h1>
    <p class="subtitle">arXiv &#8596; AlphaXiv</p>

    <p id="status"></p>
    <button id="primary" class="primary" type="button" disabled>正在读取当前页面…</button>

    <div class="settings">
      <label class="row">
        <span class="label">arXiv 页面（abs / pdf / html）显示「Open in AlphaXiv」按钮</span>
        <span class="switch">
          <input id="toggle-arxiv" type="checkbox" />
          <span class="track"></span>
        </span>
      </label>

      <label class="row">
        <span class="label">AlphaXiv 页面显示「Open arXiv HTML」按钮</span>
        <span class="switch">
          <input id="toggle-alphaxiv" type="checkbox" />
          <span class="track"></span>
        </span>
      </label>

      <button id="reset" type="button">重置浮动按钮位置</button>
      <p class="hint">拖动浮动按钮后会自动保存，作为之后所有页面的默认位置；arXiv HTML 页面会跳转到 AlphaXiv 的摘要页。</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
